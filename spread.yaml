project: hrms-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04
environment:
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'

integration-suites:
  tests/integration/:
    pytest-arguments-template: |
      --model testing
    working-dir: ./
    summary: integration tests
    backends:
    - integration-test
