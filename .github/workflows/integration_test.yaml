name: Integration tests

on:
  pull_request:
  schedule:
  - cron: "0 15 * * SAT"

jobs:
  integration-tests-juju-3:
    uses: 
      canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    permissions:
      contents: read
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      trivy-fs-enabled: false
      trivy-image-config: "trivy.yaml"
      self-hosted-runner: false
      juju-channel: '3/stable'
      channel: '1.34-strict/stable'
      microk8s-addons: "dns metallb:10.64.140.43-10.64.140.49 rbac storage"
      pre-run-script: scripts/setup-integration-rbac.sh
      with-uv: true
  integration-tests:
    uses: 
      canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    permissions:
      contents: read
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      trivy-fs-enabled: true
      trivy-image-config: "trivy.yaml"
      self-hosted-runner: false
      juju-channel: '4/stable'
      channel: '1.34-strict/stable'
      microk8s-addons: "dns metallb:10.64.140.43-10.64.140.49 rbac storage"
      pre-run-script: scripts/setup-integration-rbac.sh
      with-uv: true
  allure-report:
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs:
    - integration-tests-juju-3
    - integration-tests
    uses: canonical/operator-workflows/.github/workflows/allure_report.yaml@main
    permissions:
      contents: write
