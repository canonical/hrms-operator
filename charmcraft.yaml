type: charm
name: hrms
title: Frappe HRMS
summary: Open Source HR and Payroll Software
links:
  documentation: https://docs.frappe.io/hr
  issues: https://github.com/canonical/hrms-operator/issues
  source: https://github.com/canonical/hrms-operator
  contact: https://launchpad.net/~canonical-is-devops

description: |
  Frappe HRMS is an open-source, modern HR and payroll software built on the
  Frappe Framework. It provides comprehensive HR management including employee
  lifecycle, leave and attendance, expense claims, performance management, and
  payroll processing.

  This charm deploys Frappe HRMS on Kubernetes, integrating with MariaDB and Redis.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv

containers:
  frappe-hrms:
    resource: hrms-image

resources:
  hrms-image:
    type: oci-image
    description: Frappe HRMS OCI image built with rockcraft.

requires:
  mariadb:
    interface: mysql_client
    limit: 1
  redis:
    interface: redis
    limit: 1
  ingress:
    interface: ingress
    limit: 1

peers:
  hrms-peers:
    interface: hrms-peers


actions:
  get-admin-credentials:
    description: |
      Return the auto-generated admin credentials for the Frappe HRMS site.
      The password is generated during initial site creation and stored in
      the peer relation data.
  create-user:
    description: |
      Create a new user on the Frappe HRMS site.
    params:
      email:
        type: string
        description: Email address for the new user (used as the login).
      first-name:
        type: string
        description: First name of the new user.
      last-name:
        type: string
        description: Last name of the new user.
        default: ""
      password:
        type: string
        description: Password for the new user. If not specified, a random password is generated.
        default: ""
      role:
        type: string
        description: |
          Role to assign to the user (e.g., "HR Manager", "HR User",
          "System Manager"). If not specified, the user is created with the
          default "All" role.
        default: ""
    required: [email, first-name]
