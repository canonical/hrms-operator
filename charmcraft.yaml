type: charm
name: hrms
title: Frappe HRMS
summary: Open Source HR and Payroll Software
links:
  documentation: https://docs.frappe.io/hr
  issues: https://github.com/canonical/hrms-operator/issues
  source: https://github.com/canonical/hrms-operator
  contact: https://launchpad.net/~canonical-is-devops

description: |
  Frappe HRMS is an open-source, modern HR and payroll software built on the
  Frappe Framework. It provides comprehensive HR management including employee
  lifecycle, leave and attendance, expense claims, performance management, and
  payroll processing.

  This charm deploys Frappe HRMS on Kubernetes, integrating with MariaDB and Redis.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv

containers:
  frappe-hrms:
    resource: hrms-image

resources:
  hrms-image:
    type: oci-image
    description: Frappe HRMS OCI image.

requires:
  mariadb:
    interface: mysql_client
    limit: 1
  redis:
    interface: redis
    limit: 1
  ingress:
    interface: ingress
    limit: 1

config:
  options:
    admin-password-secret:
      type: secret
      description: |
        Juju secret URI containing the administrator password for the Frappe
        HRMS site. This must be set before the site is initialised.

        Create a secret and grant it to the application:

          juju add-secret hrms-admin-password password=<your-password>
          juju grant-secret hrms-admin-password frappe-hrms
          juju config frappe-hrms admin-password-secret=secret:<id>

        The secret must contain a key named ``password``.

peers:
  hrms-peers:
    interface: hrms-peers
