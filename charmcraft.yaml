type: charm
name: frappe-hrms
title: Frappe HRMS
summary: Open Source HR and Payroll Software for Kubernetes
links:
  documentation: https://docs.frappe.io/hr
  issues: https://github.com/canonical/hrms-operator/issues
  source: https://github.com/canonical/hrms-operator
  contact: https://launchpad.net/~canonical-is-devops

description: |
  Frappe HRMS is an open-source, modern HR and payroll application built on
  the Frappe Framework. It provides over 13 modules covering employee lifecycle,
  leave and attendance management, expense claims, performance management,
  payroll processing, and more.

  This charm deploys Frappe HRMS on Kubernetes, managing the gunicorn backend,
  nginx frontend, Socket.IO websocket, background queue workers, and the
  Frappe scheduler. It integrates with MariaDB (via data-platform-libs) and
  Redis, and exposes the application via Traefik ingress.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv

containers:
  frappe-hrms:
    resource: frappe-hrms-image

resources:
  frappe-hrms-image:
    type: oci-image
    description: |
      Frappe HRMS OCI image built with rockcraft. Contains Frappe Framework v15,
      ERPNext v15, and HRMS with all runtime dependencies.
    upstream-source: ghcr.io/canonical/frappe-hrms:latest

requires:
  mysql:
    interface: mysql_client
    limit: 1
  redis:
    interface: redis
    limit: 1
  ingress:
    interface: ingress
    limit: 1

config:
  options:
    site-name:
      type: string
      description: |
        The Frappe site name. This is typically the hostname through which
        the application will be accessed (e.g., hrms.example.com). The site
        name is used when creating the Frappe site and in the nginx configuration.
      default: ""
    admin-password:
      type: string
      description: |
        Password for the Frappe "Administrator" account. Required for initial
        site creation. After setup, this can be changed from within Frappe.
      default: ""
    proxy-read-timeout:
      type: int
      description: |
        Nginx proxy read timeout in seconds. Increase for long-running operations
        such as large payroll runs or data imports.
      default: 120
    client-max-body-size:
      type: string
      description: |
        Maximum allowed size of the client request body for nginx. Use standard
        nginx size notation (e.g., 50m, 100m, 1g). Increase for large file uploads.
      default: "50m"
    initial-db-name:
      type: string
      description: |
        Override for the initial database name. If empty, the database name is
        derived from the site name by replacing hyphens and dots with underscores.
        Only used during initial site creation.
      default: ""
