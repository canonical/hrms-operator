type: charm
name: frappe-hrms
title: Frappe HRMS
summary: Open Source HR and Payroll Software for Kubernetes
links:
  documentation: https://docs.frappe.io/hr
  issues: https://github.com/canonical/hrms-operator/issues
  source: https://github.com/canonical/hrms-operator
  contact: https://launchpad.net/~canonical-is-devops

description: |
  Frappe HRMS is an open-source, modern HR and payroll application built on
  the Frappe Framework. It provides over 13 modules covering employee lifecycle,
  leave and attendance management, expense claims, performance management,
  payroll processing, and more.

  This charm deploys Frappe HRMS on Kubernetes, managing the gunicorn backend,
  nginx frontend, Socket.IO websocket, background queue workers, and the
  Frappe scheduler. It integrates with MariaDB (via data-platform-libs) and
  Redis, and exposes the application via Traefik ingress.

base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv

containers:
  frappe-hrms:
    resource: hrms-image

resources:
  hrms-image:
    type: oci-image
    description: Frappe HRMS OCI image built with rockcraft.

requires:
  mysql:
    interface: mysql_client
    limit: 1
  redis:
    interface: redis
    limit: 1
  ingress:
    interface: ingress
    limit: 1

peers:
  hrms-peers:
    interface: hrms-peers

config:
  options:
    site-name:
      type: string
      description: |
        The Frappe site name. This is typically the hostname through which
        the application will be accessed (e.g., hrms.example.com). The site
        name is used when creating the Frappe site and in the nginx configuration.
      default: ""

actions:
  get-admin-credentials:
    description: |
      Return the auto-generated admin credentials for the Frappe HRMS site.
      The password is generated during initial site creation and stored in
      the peer relation data.
  create-user:
    description: |
      Create a new user on the Frappe HRMS site.
    params:
      email:
        type: string
        description: Email address for the new user (used as the login).
      first-name:
        type: string
        description: First name of the new user.
      last-name:
        type: string
        description: Last name of the new user.
        default: ""
      password:
        type: string
        description: Password for the new user. If not specified, a random password is generated.
        default: ""
      role:
        type: string
        description: |
          Role to assign to the user (e.g., "HR Manager", "HR User",
          "System Manager"). If not specified, the user is created with the
          default "All" role.
        default: ""
    required: [email, first-name]
