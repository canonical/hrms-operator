name: frappe-hrms
version: "16"
base: ubuntu@26.04
summary: Frappe HRMS - Open Source HR and Payroll Software
description: |
  Frappe HRMS is an open-source, modern HR and payroll software built on the
  Frappe Framework. It provides comprehensive HR management including employee
  lifecycle, leave and attendance, expense claims, performance management, and
  payroll processing.

  This rock packages Frappe Framework, ERPNext, and HRMS with all
  required runtime services: gunicorn backend, nginx frontend, Socket.IO
  websocket, background workers, and the Frappe scheduler. 
license: GPL-3.0

platforms:
  amd64:

parts:
  frappe-bench:
    plugin: nil
    build-snaps:
      - node/24/stable
    stage-snaps:
      - node/24/stable
    build-packages:
      - git
      - curl
      - gnupg
      - ca-certificates
      - build-essential
      - pipx
      - python3.14
      - python3.14-venv
      - python3.14-dev
      - libssl-dev
      - libffi-dev
      - libmariadb-dev
      - libmariadb-dev-compat
      - pkg-config
      - libjpeg-dev
      - zlib1g-dev
    stage-packages:
      - python3.14
      - nginx
      - ca-certificates
      - libssl3
      - libffi8
      - libmariadb3
      - mariadb-client
      - mysql-client
      - git
    prime:
      - -home/frappe/frappe-bench/apps/*/.git
      - -home/frappe/frappe-bench/apps/*/*/node_modules
      - -include/node
    overlay-script: |
      chroot "${CRAFT_OVERLAY}" userdel -r ubuntu 2>/dev/null || true
      groupadd -R "${CRAFT_OVERLAY}" -g 1000 frappe
      useradd -R "${CRAFT_OVERLAY}" -M -u 1000 -g frappe -d /home/frappe -s /bin/bash frappe
    override-build: |
      getent group frappe >/dev/null || groupadd -g 1000 frappe
      id -u frappe >/dev/null 2>&1 || useradd -u 1000 -g 1000 -m -d /home/frappe -s /bin/bash frappe

      runuser -s /bin/bash frappe <<EOF
      set -ex
      export PATH=/home/frappe/.local/bin:/snap/bin:/usr/local/bin:/usr/bin:/bin
      pipx install --include-deps frappe-bench

      bench init \
        --frappe-path=https://github.com/canonical/frappe \
        --frappe-branch=feat/version-16-mysql-support-ISD-6236 \
        --python=/usr/bin/python3.14 \
        --no-procfile \
        --no-backups \
        --skip-redis-config-generation \
        /home/frappe/frappe-bench
      cd /home/frappe/frappe-bench

      bench get-app erpnext --branch version-${CRAFT_PROJECT_VERSION}
      bench get-app hrms --branch version-${CRAFT_PROJECT_VERSION}

      bench build --production

      env/bin/pip install frappe-bench tzdata
      EOF

      mkdir -p "${CRAFT_PART_INSTALL}/home/frappe"
      cp -a /home/frappe/frappe-bench "${CRAFT_PART_INSTALL}/home/frappe/"

  nginx-config:
    plugin: dump
    source: templates/
    organize:
      nginx-frappe.conf: etc/nginx/conf.d/frappe.conf
      statsd-mapping.conf: etc/statsd-mapping.conf

  statsd-exporter:
    plugin: nil
    build-packages:
      - curl
    override-build: |
      STATSD_EXPORTER_VERSION=0.28.0
      ARCH="${CRAFT_ARCH_BUILD_FOR}"
      cd "${CRAFT_PART_BUILD}"
      curl -sSL -O "https://github.com/prometheus/statsd_exporter/releases/download/v${STATSD_EXPORTER_VERSION}/statsd_exporter-${STATSD_EXPORTER_VERSION}.linux-${ARCH}.tar.gz"
      curl -sSL -O "https://github.com/prometheus/statsd_exporter/releases/download/v${STATSD_EXPORTER_VERSION}/sha256sums.txt"
      grep "statsd_exporter-${STATSD_EXPORTER_VERSION}.linux-${ARCH}.tar.gz" sha256sums.txt | sha256sum -c -
      tar -xzf "statsd_exporter-${STATSD_EXPORTER_VERSION}.linux-${ARCH}.tar.gz"
      install -D -m 0755 \
        "statsd_exporter-${STATSD_EXPORTER_VERSION}.linux-${ARCH}/statsd_exporter" \
        "${CRAFT_PART_INSTALL}/bin/statsd_exporter"

