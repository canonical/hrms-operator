# statsd_exporter mapping for gunicorn statsd metrics emitted by the
# Frappe HRMS backend (prefix: frappe_hrms).
mappings:
  - match: "frappe_hrms.gunicorn.request.status.*"
    name: "gunicorn_request_status_total"
    labels:
      status: "$1"
  - match: "frappe_hrms.gunicorn.request.duration"
    name: "gunicorn_request_duration_seconds"
  - match: "frappe_hrms.gunicorn.requests"
    name: "gunicorn_requests_total"
  - match: "frappe_hrms.gunicorn.workers"
    name: "gunicorn_workers"
  - match: "frappe_hrms.gunicorn.log.*"
    name: "gunicorn_log_total"
    labels:
      level: "$1"
